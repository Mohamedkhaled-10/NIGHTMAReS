<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل دخول الأدمن - Nightmares</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
    body { font-family: 'Cairo', sans-serif; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
  <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-sm border border-gray-700">
    <div class="text-center mb-6">
      <i class="fas fa-ghost text-4xl text-red-600 mb-2"></i>
      <h2 class="text-2xl font-bold">بوابة الإدارة</h2>
    </div>
    
    <form id="login-form" class="space-y-4">
      <div>
        <input type="email" id="email" placeholder="البريد الإلكتروني" class="w-full p-3 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500" required>
      </div>
      <div>
        <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-3 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-red-500" required>
      </div>
      <button type="submit" id="btn-login" class="w-full bg-red-600 hover:bg-red-700 transition text-white font-bold p-3 rounded mt-2">
        تسجيل الدخول <i class="fas fa-sign-in-alt mr-2"></i>
      </button>
    </form>
    
    <p id="error-msg" class="mt-4 text-red-500 text-center font-semibold text-sm hidden"></p>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
