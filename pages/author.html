<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('nightmares-theme');
        var theme = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي للكاتب - NIGHTMAReS</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-[var(--color-bg-base)] text-[var(--color-text-primary)] overflow-x-hidden selection:bg-[var(--color-accent)] selection:text-white min-h-screen flex flex-col">

  <!-- NAVBAR_PLACEHOLDER -->

  <!-- Header Section -->
  <header class="pt-32 pb-12 md:pb-16 relative border-b border-[var(--color-border-subtle)]">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[var(--color-accent)]/10 via-[var(--color-bg-base)] to-[var(--color-bg-base)] -z-10"></div>
    <div class="container mx-auto px-4 max-w-5xl">
      <div class="flex flex-col md:flex-row items-center md:items-start gap-8">
        <!-- Avatar -->
        <div class="w-32 h-32 md:w-40 md:h-40 shrink-0 relative group">
          <div class="absolute inset-0 bg-[var(--color-accent)] rounded-full blur-md opacity-30 group-hover:opacity-60 transition duration-500"></div>
          <img id="author-avatar" src="/assets/images/logo1.png" alt="الكاتب" class="w-full h-full rounded-full object-cover border-4 border-[var(--color-border-strong)] relative z-10 bg-[var(--color-bg-surface)]" loading="lazy">
        </div>
        
        <!-- Author Info -->
        <div class="grow text-center md:text-right pt-4">
          <h1 id="author-name" class="text-3xl md:text-5xl font-bold mb-3 font-serif">جاري التحميل...</h1>
          
          <div class="flex items-center justify-center md:justify-start gap-6 mt-6">
            <div class="text-center">
              <span id="author-posts-count" class="block text-2xl font-bold text-[var(--color-accent)]">0</span>
              <span class="text-[var(--color-text-secondary)] text-sm">مقال منشور</span>
            </div>
            
            <button id="btn-report-author" class="mt-2 flex items-center gap-2 px-4 py-2.5 bg-accent-20 text-[var(--color-accent)] border border-accent-30 rounded-lg hover:bg-accent-40 hover:text-[var(--color-accent)] transition-colors hidden">
              <i class="fas fa-flag"></i> إبلاغ عن الكاتب
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Report Modal -->
  <div id="report-modal" class="hidden fixed inset-0 bg-black/80 z-[9999] flex justify-center items-center backdrop-blur-sm">
    <div class="bg-[var(--color-bg-elevated)] border border-[var(--color-border-strong)] rounded-2xl p-6 max-w-md w-full mx-4 shadow-elevation">
      <h3 class="text-xl font-bold text-[var(--color-text-primary)] mb-4 border-b border-[var(--color-border-subtle)] pb-2">تقديم إبلاغ عن مستخدم</h3>
      <p class="text-[var(--color-text-secondary)] text-sm mb-4">يرجى تحديد سبب الإبلاغ.</p>
      <select id="report-reason" class="w-full bg-[var(--color-bg-input)] border border-[var(--color-border-subtle)] rounded p-2 text-[var(--color-text-primary)] mb-4 outline-none focus:border-[var(--color-accent)]">
        <option value="spam">حساب مزيف / مزعج</option>
        <option value="harassment">مضايقة أو تنمر</option>
        <option value="inappropriate">محتوى غير لائق عام</option>
        <option value="other">أخرى</option>
      </select>
      <textarea id="report-details" rows="3" class="w-full bg-[var(--color-bg-input)] border border-[var(--color-border-subtle)] rounded p-2 text-[var(--color-text-primary)] mb-4 outline-none focus:border-[var(--color-accent)]" placeholder="تفاصيل إضافية (اختياري)..."></textarea>
      <div id="report-msg" class="hidden text-sm mb-4 font-bold text-center"></div>
      <div class="flex gap-3 justify-end mt-2">
        <button id="btn-cancel-report" class="px-4 py-2.5 bg-[var(--color-bg-input)] hover:bg-[var(--color-bg-surface)] text-[var(--color-text-secondary)] hover:text-[var(--color-text-primary)] border border-[var(--color-border-subtle)] rounded transition">إلغاء</button>
        <button id="btn-submit-report" class="px-4 py-2.5 bg-[var(--color-accent)] hover:bg-[var(--color-accent-hover)] text-white rounded transition font-bold">إرسال الإبلاغ</button>
      </div>
    </div>
  </div>

  <!-- Author Content -->
  <main class="grow flex-col w-full pb-12 md:pb-16 " >
    <div class="container mx-auto px-4 max-w-5xl">
      
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl font-bold text-[var(--color-text-primary)] flex items-center gap-3">
          <i class="fas fa-feather-alt text-[var(--color-accent)]"></i>
          مقالات الكاتب
        </h2>
      </div>

      <div id="author-posts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Posts will be loaded here -->
        <div class="col-span-full text-center text-[var(--color-text-meta)] py-12">
          <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
          <p>جاري تحميل المقالات...</p>
        </div>
      </div>
      
    </div>
  </main>

  <!-- FOOTER_PLACEHOLDER -->
  <script type="module" src="/js/author.js"></script>
</body>
</html>
