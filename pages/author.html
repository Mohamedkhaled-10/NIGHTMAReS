<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي للكاتب - NIGHTMAReS</title>
</head>
<body class="bg-[#050202] text-white overflow-x-hidden selection:bg-red-900 selection:text-white min-h-screen flex flex-col">

  <!-- NAVBAR_PLACEHOLDER -->

  <!-- Header Section -->
  <header class="pt-32 pb-16 relative border-b border-red-900/30">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-red-900/10 via-[#050202] to-[#050202] -z-10"></div>
    <div class="container mx-auto px-4 max-w-5xl">
      <div class="flex flex-col md:flex-row items-center md:items-start gap-8">
        <!-- Avatar -->
        <div class="w-32 h-32 md:w-40 md:h-40 shrink-0 relative group">
          <div class="absolute inset-0 bg-red-600 rounded-full blur-md opacity-30 group-hover:opacity-60 transition duration-500"></div>
          <img id="author-avatar" src="/assets/images/logo1.png" alt="الكاتب" class="w-full h-full rounded-full object-cover border-4 border-[#1a0505] relative z-10 bg-[#0a0505]" loading="lazy">
        </div>
        
        <!-- Author Info -->
        <div class="grow text-center md:text-right pt-4">
          <h1 id="author-name" class="text-3xl md:text-5xl font-bold mb-3 font-serif">جاري التحميل...</h1>
          
          <div class="flex items-center justify-center md:justify-start gap-6 mt-6">
            <div class="text-center">
              <span id="author-posts-count" class="block text-2xl font-bold text-red-500">0</span>
              <span class="text-gray-400 text-sm">مقال منشور</span>
            </div>
            
            <button id="btn-report-author" class="mt-2 flex items-center gap-2 px-4 py-2.5 bg-red-900/20 text-red-400 border border-red-900/30 rounded-lg hover:bg-red-900/40 hover:text-red-300 transition-colors hidden">
              <i class="fas fa-flag"></i> إبلاغ عن الكاتب
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Report Modal -->
  <div id="report-modal" class="hidden fixed inset-0 bg-black/80 z-[9999] flex justify-center items-center backdrop-blur-sm">
    <div class="bg-[#111] border border-red-900/30 rounded-xl p-6 max-w-md w-full mx-4 shadow-2xl">
      <h3 class="text-xl font-bold text-white mb-4 border-b border-red-900/30 pb-2">تقديم إبلاغ عن مستخدم</h3>
      <p class="text-gray-400 text-sm mb-4">يرجى تحديد سبب الإبلاغ.</p>
      <select id="report-reason" class="w-full bg-[#222] border border-red-900/30 rounded p-2 text-white mb-4 outline-none focus:border-red-600">
        <option value="spam">حساب مزيف / مزعج</option>
        <option value="harassment">مضايقة أو تنمر</option>
        <option value="inappropriate">محتوى غير لائق عام</option>
        <option value="other">أخرى</option>
      </select>
      <textarea id="report-details" rows="3" class="w-full bg-[#222] border border-red-900/30 rounded p-2 text-white mb-4 outline-none focus:border-red-600" placeholder="تفاصيل إضافية (اختياري)..."></textarea>
      <div id="report-msg" class="hidden text-sm mb-4 font-bold text-center"></div>
      <div class="flex gap-3 justify-end mt-2">
        <button id="btn-cancel-report" class="px-4 py-2.5 bg-gray-700 hover:bg-gray-600 text-white rounded transition">إلغاء</button>
        <button id="btn-submit-report" class="px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded transition">إرسال الإبلاغ</button>
      </div>
    </div>
  </div>

  <!-- Author Content -->
  <main class="py-16 min-h-[50vh]">
    <div class="container mx-auto px-4 max-w-5xl">
      
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl font-bold text-white flex items-center gap-3">
          <i class="fas fa-feather-alt text-red-600"></i>
          مقالات الكاتب
        </h2>
      </div>

      <div id="author-posts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Posts will be loaded here -->
        <div class="col-span-full text-center text-gray-500 py-12">
          <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
          <p>جاري تحميل المقالات...</p>
        </div>
      </div>
      
    </div>
  </main>

  <!-- FOOTER_PLACEHOLDER -->
  <script type="module" src="/js/author.js"></script>
</body>
</html>
