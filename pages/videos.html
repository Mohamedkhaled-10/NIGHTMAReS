<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('nightmares-theme');
        var theme = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الفيديوهات - NIGHTMAReS</title>
  <meta name="description" content="تصفح مكتبة الفيديوهات.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles/main.css">

  <style>
    /* Override legacy limits from main.css */
    #explore-grid .news-card:nth-child(n),
    #explore-grid .video-card:nth-child(n) {
      display: flex !important;
    }
    
    #explore-grid .news-card, 
    #explore-grid .video-card, 
    #explore-grid .card {
      min-height: 380px;
      height: 100%;
    }
    
    #explore-grid .news-card img {
      height: 220px !important;
    }
  </style>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
</head>

<body class="bg-[var(--color-bg-base)] text-[var(--color-text-primary)] overflow-x-hidden selection:bg-[var(--color-accent)] selection:text-white min-h-screen flex flex-col">
  <!-- NAVBAR_PLACEHOLDER -->
  
  <main class="grow flex-col w-full pt-20 md:pt-24 pb-12 md:pb-16 " >
    <!-- Premium Header -->
    <section class="relative w-full overflow-hidden border-b border-[var(--color-border-subtle)] bg-[var(--color-bg-surface)] py-20 lg:py-28">
      <!-- Atmospheric Background Elements -->
      <div class="absolute inset-0 z-0">
        <div class="absolute top-[-50%] left-[-10%] w-[70%] h-[150%] bg-accent-10 blur-[120px] rounded-full pointer-events-none"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[100%] bg-[var(--color-bg-base)] blur-[80px] pointer-events-none"></div>
        <!-- Grid pattern overlay -->
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LCAyNTUsIDI1NSwgMC4wNSkiLz48L3N2Zz4=')] opacity-50"></div>
      </div>
      
      <div class="container mx-auto px-6 relative z-10 text-center max-w-4xl">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-accent-30 bg-accent-10 mb-6">
          <i class="fa-solid fa-play text-[var(--color-accent)] text-xs"></i>
          <span class="text-[var(--color-accent)] text-[10px] font-bold tracking-widest uppercase">السينما المظلمة</span>
        </div>
        <h1 class="text-4xl md:text-6xl font-black text-[var(--color-text-primary)] mb-6 tracking-tight drop-shadow-2xl">
          فيديوهات <span class="text-transparent bg-clip-text bg-gradient-to-l from-[var(--color-accent)] to-[var(--color-accent)]">الرعب</span>
        </h1>
        <p class="text-[var(--color-text-secondary)] text-base md:text-lg leading-relaxed max-w-2xl mx-auto font-medium">
          شاهد ما لا يمكن تفسيره... تصفح مكتبتنا من الفيديوهات والمقاطع الغامضة.
        </p>
      </div>
    </section>

    <div class="container mx-auto px-4 md:px-8 lg:px-12 py-12 max-w-7xl">
      <!-- Smart Content Discovery -->
      <div class="mb-12 relative z-20 -mt-8 md:-mt-12 bg-transparent">
        
        <!-- Category Chips -->
        <div id="category-chips" class="filter-scroll-container hide-scrollbar flex items-center gap-2.5 pb-4 mb-2">
          <!-- The hidden select is kept so the JS still works seamlessly, but we'll bind chips to it -->
          <select id="filter-category" class="hidden">
            <option value="">جميع التصنيفات</option>
            <option value="horror">رعب (Horror)</option>
            <option value="mystery">غموض (Mystery)</option>
            <option value="true_crime">جرائب حقيقية (True Crime)</option>
            <option value="paranormal">ما وراء الطبيعة (Paranormal)</option>
            <option value="legends">أساطير (Legends)</option>
            <option value="movies">أفلام (Movies)</option>
            <option value="games">ألعاب (Games)</option>
          </select>
          
          <button type="button" data-val="" class="category-chip shrink-0 min-h-[44px] px-5 py-2 rounded-full border border-[var(--color-accent)] bg-accent-20 text-[var(--color-text-primary)] font-bold text-sm transition-all is-active">الكل</button>
          <button type="button" data-val="horror" class="category-chip shrink-0 min-h-[44px] px-5 py-2 rounded-full border border-[var(--color-border-subtle)] bg-[var(--color-bg-surface)] text-[var(--color-text-secondary)] font-semibold text-sm transition-all">رعب</button>
          <button type="button" data-val="mystery" class="category-chip shrink-0 min-h-[44px] px-5 py-2 rounded-full border border-[var(--color-border-subtle)] bg-[var(--color-bg-surface)] text-[var(--color-text-secondary)] font-semibold text-sm transition-all">غموض</button>
          <button type="button" data-val="true_crime" class="category-chip shrink-0 min-h-[44px] px-5 py-2 rounded-full border border-[var(--color-border-subtle)] bg-[var(--color-bg-surface)] text-[var(--color-text-secondary)] font-semibold text-sm transition-all">جرائم حقيقية</button>
          <button type="button" data-val="paranormal" class="category-chip shrink-0 min-h-[44px] px-5 py-2 rounded-full border border-[var(--color-border-subtle)] bg-[var(--color-bg-surface)] text-[var(--color-text-secondary)] font-semibold text-sm transition-all">ما وراء الطبيعة</button>
          <button type="button" data-val="legends" class="category-chip shrink-0 min-h-[44px] px-5 py-2 rounded-full border border-[var(--color-border-subtle)] bg-[var(--color-bg-surface)] text-[var(--color-text-secondary)] font-semibold text-sm transition-all">أساطير</button>
        </div>

        <form id="videos-filters" class="flex flex-wrap items-center gap-3 md:gap-4 w-full p-4 md:p-5 bg-[var(--color-bg-surface)] border border-[var(--color-border-subtle)] rounded-2xl shadow-elevation backdrop-blur-md">
          
          <!-- Tag Search -->
          <div class="relative w-full md:flex-1 min-w-[220px]">
            <i class="fa-solid fa-hashtag absolute right-4 top-1/2 -translate-y-1/2 text-[var(--color-text-meta)] text-sm"></i>
            <input type="text" id="filter-tag" placeholder="ابحث بكلمة دلالية..." class="w-full pr-10 pl-4 py-3 bg-[var(--color-bg-base)] border border-[var(--color-border-subtle)] rounded-xl text-[var(--color-text-primary)] focus:border-[var(--color-accent)] focus:outline-none focus:ring-1 focus:ring-[var(--color-accent)] transition-all text-sm font-medium placeholder-[var(--color-text-meta)]">
          </div>

          <!-- Sort Filter -->
          <div class="relative w-full md:w-56 shrink-0 min-w-[170px]">
            <i class="fa-solid fa-sort absolute right-4 top-1/2 -translate-y-1/2 text-[var(--color-text-meta)] text-sm"></i>
            <select id="filter-sort" class="w-full appearance-none pr-10 pl-10 py-3 bg-[var(--color-bg-base)] border border-[var(--color-border-subtle)] rounded-xl text-[var(--color-text-primary)] focus:border-[var(--color-accent)] focus:outline-none focus:ring-1 focus:ring-[var(--color-accent)] transition-all text-sm font-medium cursor-pointer">
              <option value="desc">الأحدث أولاً</option>
              <option value="asc">الأقدم أولاً</option>
              <option value="popular">الأكثر مشاهدة</option>
            </select>
            <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-[var(--color-text-meta)] text-xs">
              <i class="fa-solid fa-chevron-down"></i>
            </div>
          </div>
          
          <!-- Clear Filters -->
          <button type="button" id="clear-filters-btn" class="hidden w-full md:w-auto px-6 py-3 bg-transparent text-[var(--color-text-secondary)] hover:text-[var(--color-accent)] rounded-xl border border-[var(--color-border-subtle)] hover:border-accent-50 transition-all text-sm font-semibold flex items-center justify-center gap-2 shrink-0">
            <i class="fa-solid fa-times"></i> مسح
          </button>
          
          <!-- Hidden Submit (For Enter key to work) -->
          <button type="submit" class="hidden"></button>
        </form>
      </div>

      <!-- Content Grid -->
      <div id="videos-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        <!-- Cards will be injected here by JS -->
      </div>
      
      <!-- Load More -->
      <div id="load-more-container" class="mt-16 text-center hidden">
        <button id="load-more-btn" class="group relative px-8 py-3 bg-[var(--color-bg-surface)] border border-[var(--color-border-subtle)] text-[var(--color-text-secondary)] hover:text-[var(--color-text-primary)] rounded-full transition-all duration-300 font-bold overflow-hidden">
          <span class="relative z-10 flex items-center gap-2">
            تحميل المزيد <i class="fa-solid fa-chevron-down text-sm group-hover:translate-y-1 transition-transform"></i>
          </span>
          <div class="absolute inset-0 bg-accent-20 -translate-x-[150%] group-hover:translate-x-0 transition-transform duration-500 ease-in-out skew-x-12"></div>
        </button>
      </div>
      
    </div>
  </main>
  
  <!-- FOOTER_PLACEHOLDER -->
  
  <!-- Type modules for JS -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script type="module" src="/js/videos.js"></script>
</body>
</html>
