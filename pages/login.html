<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>الملاذ المظلم - تسجيل الدخول</title>
  <meta name="description" content="سجل دخولك إلى NIGHTMAReS، الملاذ الأول والأخير لعشاق الرعب والغموض.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
    body { font-family: 'Cairo', sans-serif; }
    
    .input-wrapper:focus-within {
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.4);
      border-color: rgba(220, 38, 38, 0.8);
    }
    
    .auth-bg {
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%239c0000' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
  </style>
</head>
<body class="bg-[#050202] text-gray-300 min-h-screen flex flex-col selection:bg-red-900 selection:text-white overflow-x-hidden">
  <!-- NAVBAR_PLACEHOLDER -->

  <main class="grow flex w-full relative">
    <!-- Split Layout Container -->
    <div class="flex flex-col lg:flex-row w-full min-h-[calc(100vh-64px)] lg:min-h-screen">
      
      <!-- Left: Visual Horror Panel (Top on Mobile) -->
      <div class="w-full lg:w-1/2 relative min-h-[30vh] lg:min-h-full flex flex-col justify-center items-center overflow-hidden shrink-0 border-b lg:border-b-0 lg:border-l border-red-900/30">
        
        <!-- Video Background (Loaded via JS for performance, or standard with preload="none") -->
        <video class="absolute inset-0 w-full h-full object-cover opacity-40 mix-blend-luminosity hidden sm:block motion-reduce:hidden filter grayscale-[30%]" 
               autoplay loop muted playsinline preload="none" poster="/assets/images/1.webp">
          <source src="https://assets.mixkit.co/videos/preview/mixkit-dark-smoke-fog-on-a-black-background-4235-small.mp4" type="video/mp4">
        </video>

        <!-- Base Cinematic Image (Fallback / Mobile) -->
        <img src="/assets/images/1.webp" alt="NIGHTMAReS Visual" class="absolute inset-0 w-full h-full object-cover opacity-50 filter grayscale-[30%] scale-105 sm:hidden motion-reduce:block">
        
        <!-- Overlays for deep cinematic feel -->
        <div class="absolute inset-0 bg-[#050202]/60 mix-blend-multiply pointer-events-none"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#050202] via-transparent to-[#050202]/50 lg:bg-gradient-to-r lg:from-[#050202] lg:via-transparent pointer-events-none"></div>
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_transparent_0%,_#050202_100%)] pointer-events-none"></div>
        <div class="absolute inset-0 bg-red-950/10 mix-blend-overlay pointer-events-none animate-pulse" style="animation-duration: 8s;"></div>
        
        <!-- Subtle Red Lighting Element -->
        <div class="absolute -top-1/4 -right-1/4 w-[120%] h-[120%] bg-red-900/20 blur-[120px] rounded-full pointer-events-none mix-blend-overlay"></div>

        <!-- Panel Content -->
        <div class="relative z-20 text-center flex flex-col items-center px-6 lg:px-12 py-12 lg:py-0">
          <a href="/" class="block group">
            <div class="relative w-24 h-24 md:w-32 md:h-32 mb-6 mx-auto">
              <div class="absolute inset-0 bg-red-600 blur-2xl opacity-20 group-hover:opacity-40 transition-opacity duration-700 rounded-full animate-pulse"></div>
              <img src="/assets/images/logo1.png" alt="Logo" class="relative z-10 w-full h-full object-contain filter drop-shadow-[0_0_20px_rgba(220,38,38,0.4)]">
            </div>
          </a>
          <h2 class="text-3xl md:text-5xl font-black text-white mb-4 tracking-tight drop-shadow-2xl">
            NIGHTMAR<span class="text-red-600">e</span>S
          </h2>
          <p class="text-gray-300 text-sm md:text-base leading-relaxed max-w-sm mx-auto font-medium">
            بوابتك إلى العالم السفلي.<br>سجل الدخول لحفظ كوابيسك والمشاركة في مجتمع الرعب الأول.
          </p>
        </div>
      </div>

      <!-- Right: Authentication Panel (Bottom on Mobile) -->
      <div class="w-full lg:w-1/2 flex-1 flex flex-col justify-center items-center p-6 sm:p-10 lg:p-16 relative bg-[#0a0505] auth-bg">
        <div class="absolute top-0 right-0 w-full h-full bg-[radial-gradient(circle_at_top_right,_rgba(220,38,38,0.05),_transparent_60%)] pointer-events-none"></div>
        
        <!-- Auth Card -->
        <div class="w-full max-w-md relative z-10 bg-[#0a0505]/90 backdrop-blur-xl p-8 md:p-10 rounded-2xl border border-red-900/30 shadow-2xl">
          
          <div class="text-center mb-8">
            <h2 class="text-2xl md:text-3xl font-black text-white tracking-wide flex items-center justify-center gap-3">
              <i class="fa-solid fa-ghost text-red-600 text-2xl drop-shadow-[0_0_8px_rgba(220,38,38,0.6)]"></i> 
              <span id="form-title-text">تسجيل الدخول</span>
            </h2>
            <p class="text-gray-500 text-sm mt-2 font-medium" id="form-subtitle">مرحباً بك مجدداً في الظلام</p>
          </div>

          <!-- Alert Messages -->
          <div id="error-msg" class="hidden mb-6 flex items-start gap-3 bg-red-950/40 border border-red-900/30 p-4 rounded-lg text-red-400 text-sm font-semibold">
            <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
            <p id="error-text" class="grow text-right"></p>
          </div>
          
          <div id="success-msg" class="hidden mb-6 flex items-start gap-3 bg-green-950/40 border border-green-900/50 p-4 rounded-lg text-green-400 text-sm font-semibold">
            <i class="fa-solid fa-circle-check mt-0.5"></i>
            <p id="success-text" class="grow text-right"></p>
          </div>

          <!-- Auth Form -->
          <form id="auth-form" class="space-y-5" novalidate>
            
            <div id="name-field" class="hidden space-y-2">
              <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider">اسم المستخدم</label>
              <div class="input-wrapper flex items-center bg-[#110808] border border-red-900/30 rounded-lg overflow-hidden transition-all duration-300">
                <span class="pl-4 pr-4 text-gray-500"><i class="fa-solid fa-user"></i></span>
                <input type="text" id="displayName" placeholder="اسمك المستعار في الظلام" class="w-full bg-transparent border-none text-white focus:outline-none focus:ring-1 focus:ring-red-600/50 focus:border-red-600 py-3 pr-2 placeholder-gray-700 text-sm font-medium">
              </div>
              <p class="hidden text-xs text-red-500 mt-1" id="name-error">يرجى إدخال اسم مستخدم صالح</p>
            </div>
            
            <div class="space-y-2">
              <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider">البريد الإلكتروني</label>
              <div class="input-wrapper flex items-center bg-[#110808] border border-red-900/30 rounded-lg overflow-hidden transition-all duration-300">
                <span class="pl-4 pr-4 text-gray-500"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" id="email" placeholder="name@domain.com" class="w-full bg-transparent border-none text-white focus:outline-none focus:ring-1 focus:ring-red-600/50 focus:border-red-600 py-3 pr-2 placeholder-gray-700 text-sm font-medium" required>
              </div>
              <p class="hidden text-xs text-red-500 mt-1" id="email-error">صيغة البريد الإلكتروني غير صحيحة</p>
            </div>
            
            <div id="password-field" class="space-y-2">
              <div class="flex justify-between items-end">
                <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider">كلمة المرور</label>
                <button type="button" id="toggle-reset" class="text-xs text-red-500 hover:text-red-400 font-bold hover:underline focus:outline-none">نسيتها؟</button>
              </div>
              <div class="input-wrapper flex items-center bg-[#110808] border border-red-900/30 rounded-lg overflow-hidden transition-all duration-300 relative">
                <span class="pl-4 pr-4 text-gray-500"><i class="fa-solid fa-lock"></i></span>
                <input type="password" id="password" placeholder="••••••••" class="w-full bg-transparent border-none text-white focus:outline-none focus:ring-1 focus:ring-red-600/50 focus:border-red-600 py-3 pr-2 placeholder-gray-700 text-sm font-medium tracking-widest">
                <button type="button" id="toggle-password" class="absolute left-3 p-2 text-gray-500 hover:text-gray-300 transition-colors focus:outline-none" tabindex="-1">
                  <i class="fa-solid fa-eye" id="eye-icon"></i>
                </button>
              </div>
              <p class="hidden text-xs text-red-500 mt-1" id="password-error">كلمة المرور يجب أن تكون 6 أحرف على الأقل</p>
            </div>

            <button type="submit" id="btn-submit" class="w-full h-12 bg-red-700 hover:bg-red-600 text-white font-bold rounded-lg mt-8 shadow-[0_4px_12px_rgba(220,38,38,0.15)] hover:shadow-[0_6px_16px_rgba(220,38,38,0.3)] transition-all duration-300 flex items-center justify-center gap-2 group relative overflow-hidden disabled:opacity-70 disabled:cursor-not-allowed">
              <span class="relative z-10 flex items-center justify-center gap-2 w-full">
                <span id="btn-text">تسجيل الدخول</span>
                <i id="btn-icon" class="fa-solid fa-arrow-left-to-bracket transition-transform group-hover:-translate-x-1"></i>
                <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
              </span>
            </button>
          </form>

          <!-- Toggle Modes -->
          <div class="mt-8 pt-6 border-t border-red-900/20 text-center text-sm font-medium text-gray-400">
            <p id="toggle-register" class="transition-colors">ليس لديك حساب؟ <button class="text-red-500 hover:text-red-400 font-bold hover:underline ml-1 focus:outline-none">انضم إلينا الآن</button></p>
            <p id="toggle-login" class="hidden transition-colors">لديك حساب بالفعل؟ <button class="text-red-500 hover:text-red-400 font-bold hover:underline ml-1 focus:outline-none">تسجيل الدخول</button></p>
          </div>
          
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
