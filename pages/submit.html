<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استوديو الكُتّاب - NIGHTMAReS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #050202; color: #e5e7eb; }
    .studio-panel {
      background-color: rgba(13, 7, 7, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(220, 38, 38, 0.15);
      border-radius: 1rem;
    }
    .section-divider {
      position: relative;
      margin: 3rem 0;
    }
    .section-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(220, 38, 38, 0.3), transparent);
    }
    .section-divider span {
      position: relative;
      background-color: #0d0707;
      padding: 0 1rem;
      color: #9ca3af;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid rgba(220, 38, 38, 0.2);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
  </style>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
</head>
<body class="flex flex-col min-h-screen selection:bg-red-900 selection:text-white overflow-x-hidden">
<!-- NAVBAR_PLACEHOLDER -->

<main class="grow flex-col w-full pt-20 md:pt-24 pb-12 md:pb-16 relative overflow-hidden" >
  <!-- Cinematic Background Elements -->
  <div class="fixed inset-0 z-0 pointer-events-none">
    <div class="absolute inset-0 bg-[#050202]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_rgba(220,38,38,0.05),_transparent_50%)]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_bottom_left,_rgba(220,38,38,0.03),_transparent_50%)]"></div>
  </div>

  <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-4xl relative z-10">
    
    <!-- Intro -->
    <div class="text-center mb-12">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-950/30 border border-red-900/30 mb-6 relative">
        <div class="absolute inset-0 bg-red-600 blur-xl opacity-20 rounded-full animate-pulse"></div>
        <i class="fa-solid fa-feather-pointed text-2xl text-red-500 relative z-10"></i>
      </div>
      <h1 class="text-3xl md:text-5xl font-black text-white mb-4 tracking-tight" id="page-title">استوديو <span class="text-red-600">الكُتّاب</span></h1>
      <p class="text-gray-400 font-medium text-lg" id="page-subtitle">شارك كوابيسك مع المجتمع. صمم قصتك، أضف التفاصيل، وارفعها للمراجعة.</p>
    </div>

    <!-- Creator Studio Form -->
    <div class="studio-panel p-6 md:p-10 shadow-2xl relative">
      <div class="absolute top-0 right-0 w-full h-1 bg-gradient-to-l from-red-800 to-transparent"></div>
      
      <form id="submit-form" class="space-y-2 relative z-10">
        
        <!-- Step 1: Story Details -->
        <div class="text-center section-divider mt-0"><span class="bg-[#110808]"><i class="fa-solid fa-heading text-red-500"></i> تفاصيل القصة</span></div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider">عنوان القصة <span class="text-red-500">*</span></label>
            <input type="text" id="story-title" class="w-full px-4 py-3.5 bg-[#0a0505] border border-red-900/30 focus:border-red-600 focus:ring-1 focus:ring-red-600 rounded-lg text-white font-bold text-lg transition-all outline-none" placeholder="مثال: المنزل المهجور في التل..." required>
          </div>
          <div class="space-y-2">
            <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider">اسم الكاتب (أو اسم مستعار) <span class="text-red-500">*</span></label>
            <div class="relative">
              <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-600"><i class="fa-solid fa-user-pen"></i></span>
              <input type="text" id="author-name" class="w-full pr-11 pl-4 py-3.5 bg-[#0a0505] border border-red-900/30 focus:border-red-600 focus:ring-1 focus:ring-red-600 rounded-lg text-white font-medium transition-all outline-none" placeholder="كيف تريد أن تُعرف؟" required>
            </div>
          </div>
        </div>

        <!-- Step 2: Content -->
        <div class="text-center section-divider"><span class="bg-[#110808]"><i class="fa-solid fa-scroll text-red-500"></i> المحتوى</span></div>
        
        <div class="space-y-2">
          <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider flex justify-between items-end">
            <span>اسرد كابوسك <span class="text-red-500">*</span></span>
            <span id="char-count" class="text-gray-600 font-normal">0 حرف</span>
          </label>
          <div class="relative">
            <textarea id="story-content" rows="12" class="w-full px-5 py-4 bg-[#0a0505] border border-red-900/30 focus:border-red-600 focus:ring-1 focus:ring-red-600 rounded-lg text-gray-300 font-medium leading-loose transition-all outline-none resize-y" placeholder="في ليلة مظلمة، حيث لا يُسمع سوى صوت الرياح..." required></textarea>
          </div>
        </div>

        <!-- Step 3: Media & Meta (Visual Only for Studio Feel) -->
        <div class="text-center section-divider"><span class="bg-[#110808]"><i class="fa-solid fa-tags text-red-500"></i> التصنيف (اختياري)</span></div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider">غلاف القصة (صورة)</label>
            <label class="flex flex-col items-center justify-center w-full h-32 bg-[#0a0505] border-2 border-dashed border-red-900/30 hover:border-red-900/30 rounded-lg cursor-pointer transition-colors group">
              <i class="fa-solid fa-image text-2xl text-gray-600 group-hover:text-red-500 transition-colors mb-2"></i>
              <span class="text-sm font-semibold text-gray-500 group-hover:text-gray-300">انقر لرفع الغلاف (قريباً)</span>
              <input type="file" class="hidden" disabled>
            </label>
          </div>
          
          <div class="space-y-4">
            <div class="space-y-2">
               <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider">النوع / الفئة</label>
               <select id="story-category" class="w-full px-4 py-3 bg-[#0a0505] border border-red-900/30 focus:border-red-600 focus:ring-1 focus:ring-red-600 rounded-lg text-white font-medium transition-all outline-none appearance-none">
                 <option value="">اختر الفئة الرئيسية...</option>
                 <option value="رعب نفسي">رعب نفسي</option>
                 <option value="ما وراء الطبيعة">ما وراء الطبيعة</option>
                 <option value="تجارب حقيقية">تجارب حقيقية</option>
                 <option value="خيال علمي مظلم">خيال علمي مظلم</option>
               </select>
            </div>
            <div class="space-y-2">
               <label class="block text-gray-400 text-xs font-bold uppercase tracking-wider">وسوم (مفصولة بفاصلة)</label>
               <input type="text" id="story-tags" class="w-full px-4 py-3 bg-[#0a0505] border border-red-900/30 focus:border-red-600 focus:ring-1 focus:ring-red-600 rounded-lg text-gray-300 font-medium transition-all outline-none" placeholder="شياطين, أشباح, منزل مهجور...">
            </div>
          </div>
        </div>
        
        <!-- Status Messages -->
        <div id="status-msg" class="hidden mt-8 p-4 rounded-lg text-center font-bold text-sm border flex items-center justify-center gap-2"></div>

        <!-- Submit -->
        <div class="pt-10">
          <button type="submit" id="btn-submit" class="w-full bg-red-700 hover:bg-red-600 text-white font-bold py-4 rounded-lg shadow-[0_4px_15px_rgba(220,38,38,0.2)] hover:shadow-[0_8px_25px_rgba(220,38,38,0.4)] transition-all transform hover:-translate-y-1 flex items-center justify-center gap-3 group text-lg disabled:opacity-70 disabled:cursor-not-allowed">
            <span id="btn-text">إرسال القصة للمراجعة</span>
            <i id="btn-icon" class="fa-solid fa-paper-plane group-hover:-translate-x-1 transition-transform"></i>
            <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
          </button>
          <p class="text-center text-xs text-gray-500 mt-4 font-semibold"><i class="fa-solid fa-shield-halved"></i> سيتم مراجعة المحتوى من قبل الإدارة قبل النشر لضمان الجودة.</p>
        </div>

      </form>
    </div>
  </div>
</main>

<script type="module" src="/js/submit.js"></script>
<!-- FOOTER_PLACEHOLDER -->
</body>
</html>
