<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('nightmares-theme');
        var theme = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استوديو الكُتّاب - NIGHTMAReS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: var(--color-bg-base); color: var(--color-text-primary); }
    .studio-panel {
      background-color: var(--color-bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--color-border-subtle);
      border-radius: 1rem;
      box-shadow: var(--shadow-elevation);
    }
    .section-divider {
      position: relative;
      margin: 3rem 0;
    }
    .section-divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--color-border-strong), transparent);
    }
    .section-divider span {
      position: relative;
      background-color: var(--color-bg-elevated);
      padding: 0 1rem;
      color: var(--color-text-secondary);
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid var(--color-border-subtle);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
  </style>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
</head>
<body class="flex flex-col min-h-screen selection:bg-[var(--color-accent)] selection:text-white overflow-x-hidden">
<!-- NAVBAR_PLACEHOLDER -->

<main class="grow flex-col w-full pt-20 md:pt-24 pb-12 md:pb-16 relative overflow-hidden" >
  <!-- Background Elements -->
  <div class="fixed inset-0 z-0 pointer-events-none">
    <div class="absolute inset-0 bg-[var(--color-bg-base)]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_rgba(220,38,38,0.04),_transparent_50%)]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_bottom_left,_rgba(220,38,38,0.02),_transparent_50%)]"></div>
  </div>

  <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-4xl relative z-10">
    
    <!-- Intro -->
    <div class="text-center mb-12">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-accent-10 border border-[var(--color-accent)]/20 mb-6 relative">
        <div class="absolute inset-0 bg-[var(--color-accent)] blur-xl opacity-20 rounded-full animate-pulse"></div>
        <i class="fa-solid fa-feather-pointed text-2xl text-[var(--color-accent)] relative z-10"></i>
      </div>
      <h1 class="text-3xl md:text-5xl font-black text-[var(--color-text-primary)] mb-4 tracking-tight" id="page-title">استوديو <span class="text-[var(--color-accent)]">الكُتّاب</span></h1>
      <p class="text-[var(--color-text-secondary)] font-medium text-lg" id="page-subtitle">شارك كوابيسك مع المجتمع. صمم قصتك، أضف التفاصيل، وارفعها للمراجعة.</p>
    </div>

    <!-- Creator Studio Form -->
    <div class="studio-panel p-6 md:p-10 shadow-elevation relative">
      <div class="absolute top-0 right-0 w-full h-1 bg-gradient-to-l from-[var(--color-accent)] to-transparent"></div>
      
      <form id="submit-form" class="space-y-2 relative z-10">
        
        <!-- Step 1: Story Details -->
        <div class="text-center section-divider mt-0"><span><i class="fa-solid fa-heading text-[var(--color-accent)]"></i> تفاصيل القصة</span></div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="block text-[var(--color-text-secondary)] text-xs font-bold uppercase tracking-wider">عنوان القصة <span class="text-[var(--color-accent)]">*</span></label>
            <input type="text" id="story-title" class="w-full px-4 py-3.5 bg-[var(--color-bg-input)] border border-[var(--color-border-subtle)] focus:border-[var(--color-accent)] rounded-lg text-[var(--color-text-primary)] font-bold text-lg transition-all outline-none" placeholder="مثال: المنزل المهجور في التل..." required>
          </div>
          <div class="space-y-2">
            <label class="block text-[var(--color-text-secondary)] text-xs font-bold uppercase tracking-wider">اسم الكاتب (أو اسم مستعار) <span class="text-[var(--color-accent)]">*</span></label>
            <div class="relative">
              <span class="absolute right-4 top-1/2 -translate-y-1/2 text-[var(--color-text-meta)]"><i class="fa-solid fa-user-pen"></i></span>
              <input type="text" id="author-name" class="w-full pr-11 pl-4 py-3.5 bg-[var(--color-bg-input)] border border-[var(--color-border-subtle)] focus:border-[var(--color-accent)] rounded-lg text-[var(--color-text-primary)] font-medium transition-all outline-none" placeholder="كيف تريد أن تُعرف؟" required>
            </div>
          </div>
        </div>

        <!-- Step 2: Content -->
        
        <!-- Horror Type Selector -->
        <div class="space-y-3 mt-8 mb-6">
          <label class="block text-[var(--color-text-secondary)] text-xs font-bold uppercase tracking-wider">نوع الرعب <span class="text-[var(--color-accent)]">*</span></label>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-3" id="horror-type-selector">
            <button type="button" data-type="ghosts" class="horror-type-btn min-h-[56px] border border-[var(--color-border-subtle)] bg-[var(--color-bg-input)] rounded-xl p-3.5 text-center transition-all flex flex-col items-center justify-center gap-1.5">
              <i class="fa-solid fa-ghost text-2xl text-[var(--color-accent)]"></i>
              <span class="text-sm font-semibold">أشباح</span>
            </button>
            <button type="button" data-type="jinn" class="horror-type-btn min-h-[56px] border border-[var(--color-border-subtle)] bg-[var(--color-bg-input)] rounded-xl p-3.5 text-center transition-all flex flex-col items-center justify-center gap-1.5">
              <i class="fa-solid fa-fire text-2xl text-[var(--color-accent)]"></i>
              <span class="text-sm font-semibold">جن</span>
            </button>
            <button type="button" data-type="urban_legend" class="horror-type-btn min-h-[56px] border border-[var(--color-border-subtle)] bg-[var(--color-bg-input)] rounded-xl p-3.5 text-center transition-all flex flex-col items-center justify-center gap-1.5">
              <i class="fa-solid fa-city text-2xl text-[var(--color-accent)]"></i>
              <span class="text-sm font-semibold">أساطير حضرية</span>
            </button>
            <button type="button" data-type="psychological" class="horror-type-btn min-h-[56px] border border-[var(--color-border-subtle)] bg-[var(--color-bg-input)] rounded-xl p-3.5 text-center transition-all flex flex-col items-center justify-center gap-1.5">
              <i class="fa-solid fa-brain text-2xl text-[var(--color-accent)]"></i>
              <span class="text-sm font-semibold">رعب نفسي</span>
            </button>
            <button type="button" data-type="true_story" class="horror-type-btn min-h-[56px] border border-[var(--color-border-subtle)] bg-[var(--color-bg-input)] rounded-xl p-3.5 text-center transition-all flex flex-col items-center justify-center gap-1.5">
              <i class="fa-solid fa-newspaper text-2xl text-[var(--color-accent)]"></i>
              <span class="text-sm font-semibold">مبنية على حقيقة</span>
            </button>
            <button type="button" data-type="other" class="horror-type-btn min-h-[56px] border border-[var(--color-border-subtle)] bg-[var(--color-bg-input)] rounded-xl p-3.5 text-center transition-all flex flex-col items-center justify-center gap-1.5">
              <i class="fa-solid fa-masks-theater text-2xl text-[var(--color-accent)]"></i>
              <span class="text-sm font-semibold">أخرى</span>
            </button>
          </div>
          <input type="hidden" id="suggestedHorrorType" required>
        </div>

        <div class="text-center section-divider"><span><i class="fa-solid fa-scroll text-[var(--color-accent)]"></i> المحتوى</span></div>
        
        <div class="space-y-2 mt-4">
          <label class="block text-[var(--color-text-secondary)] text-xs font-bold uppercase tracking-wider flex justify-between items-end">
            <span>اسرد كابوسك <span class="text-[var(--color-accent)]">*</span></span>
            <div class="flex items-center gap-4">
              <span id="reading-time" class="text-[var(--color-text-meta)] font-normal text-xs">مدة القراءة: 1 دقيقة</span>
              <span id="char-count" class="text-[var(--color-text-meta)] font-normal text-xs">0 حرف</span>
            </div>
          </label>
          <div class="relative">
            <textarea id="story-content" rows="12" class="w-full px-5 py-4 bg-[var(--color-bg-input)] border border-[var(--color-border-subtle)] focus:border-[var(--color-accent)] rounded-lg text-[var(--color-text-primary)] font-medium leading-loose transition-all outline-none resize-y" placeholder="في ليلة مظلمة، حيث لا يُسمع سوى صوت الرياح..." required></textarea>
          </div>
          
          <!-- Content Warning -->
          <div class="mt-4 p-4 border border-[var(--color-border-subtle)] bg-[var(--color-bg-surface)] rounded-lg">
            <label class="flex items-center gap-3 cursor-pointer">
              <input type="checkbox" id="suggestedContentWarning" class="w-5 h-5 accent-[var(--color-accent)] bg-[var(--color-bg-input)] border-[var(--color-border-strong)] rounded cursor-pointer">
              <span class="text-[var(--color-text-primary)] text-sm font-semibold select-none">هل تحتوي القصة على مشاهد قد تكون مزعجة لبعض القراء؟</span>
            </label>
            <div id="content-warning-note-container" class="mt-3 hidden transition-all">
              <input type="text" id="suggestedContentWarningNote" maxlength="150" placeholder="ملاحظة قصيرة اختيارية (مثال: عنف نفسي شديد)" class="w-full bg-[var(--color-bg-input)] border border-[var(--color-border-subtle)] rounded-lg px-4 py-2 text-[var(--color-text-primary)] focus:outline-none focus:border-[var(--color-accent)] text-sm transition-colors">
            </div>
          </div>
        </div>

        <!-- Step 3: Media & Meta (Visual Only for Studio Feel) -->
        <div class="text-center section-divider"><span><i class="fa-solid fa-tags text-[var(--color-accent)]"></i> التصنيف (اختياري)</span></div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="block text-[var(--color-text-secondary)] text-xs font-bold uppercase tracking-wider">غلاف القصة (صورة)</label>
            <label class="flex flex-col items-center justify-center w-full h-32 bg-[var(--color-bg-input)] border-2 border-dashed border-[var(--color-border-strong)] rounded-lg cursor-pointer transition-colors group">
              <i class="fa-solid fa-image text-2xl text-[var(--color-text-meta)] group-hover:text-[var(--color-accent)] transition-colors mb-2"></i>
              <span class="text-sm font-semibold text-[var(--color-text-secondary)] group-hover:text-[var(--color-text-primary)]">انقر لرفع الغلاف (قريباً)</span>
              <input type="file" class="hidden" disabled>
            </label>
          </div>
          
          <div class="space-y-4">
            <div class="space-y-2">
               <label class="block text-[var(--color-text-secondary)] text-xs font-bold uppercase tracking-wider">النوع / الفئة</label>
               <select id="story-category" class="w-full px-4 py-3 bg-[var(--color-bg-input)] border border-[var(--color-border-subtle)] focus:border-[var(--color-accent)] rounded-lg text-[var(--color-text-primary)] font-medium transition-all outline-none appearance-none">
                 <option value="">اختر الفئة الرئيسية...</option>
                 <option value="رعب نفسي">رعب نفسي</option>
                 <option value="ما وراء الطبيعة">ما وراء الطبيعة</option>
                 <option value="تجارب حقيقية">تجارب حقيقية</option>
                 <option value="خيال علمي مظلم">خيال علمي مظلم</option>
               </select>
            </div>
            <div class="space-y-2">
               <label class="block text-[var(--color-text-secondary)] text-xs font-bold uppercase tracking-wider">وسوم (مفصولة بفاصلة)</label>
               <input type="text" id="story-tags" class="w-full px-4 py-3 bg-[var(--color-bg-input)] border border-[var(--color-border-subtle)] focus:border-[var(--color-accent)] rounded-lg text-[var(--color-text-primary)] font-medium transition-all outline-none" placeholder="شياطين, أشباح, منزل مهجور...">
            </div>
          </div>
        </div>
        
        <!-- Status Messages -->
        <div id="status-msg" class="hidden mt-8 p-4 rounded-lg text-center font-bold text-sm border flex items-center justify-center gap-2"></div>

        <!-- Submit -->
        <div class="pt-10">
          <button type="submit" id="btn-submit" class="w-full bg-[var(--color-accent)] hover:bg-[var(--color-accent-hover)] text-white font-bold py-4 rounded-lg glow-subtle hover:glow-accent transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-3 group text-lg disabled:opacity-70 disabled:cursor-not-allowed shadow-elevation">
            <span id="btn-text">إرسال القصة للمراجعة</span>
            <i id="btn-icon" class="fa-solid fa-paper-plane group-hover:-translate-x-1 transition-transform"></i>
            <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
          </button>
          <p class="text-center text-xs text-[var(--color-text-meta)] mt-4 font-semibold"><i class="fa-solid fa-shield-halved"></i> سيتم مراجعة المحتوى من قبل الإدارة قبل النشر لضمان الجودة.</p>
        </div>

      </form>
    </div>
  </div>
</main>

<script type="module" src="/js/submit.js"></script>
<!-- FOOTER_PLACEHOLDER -->
</body>
</html>
