<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البحث - NIGHTMAReS</title>
  <meta name="description" content="ابحث عن قصص الرعب، ألعاب، أو الأخبار المرعبة.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .highlight-match {
      background-color: rgba(220, 38, 38, 0.6);
      color: white;
      font-weight: 800;
      padding: 0 4px;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(220, 38, 38, 0.4);
    }
    
    /* Override legacy limits from main.css */
    #results-container .news-card:nth-child(n),
    #results-container .video-card:nth-child(n) {
      display: flex !important;
    }
    
    #results-container .news-card, 
    #results-container .video-card, 
    #results-container .card {
      min-height: 380px;
      height: 100%;
    }
    
    #results-container .news-card img {
      height: 220px !important;
    }
    
    .search-input-wrapper:focus-within {
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.2);
      border-color: rgba(220, 38, 38, 0.8);
    }
  </style>
</head>
<body class="bg-[#050202] text-white font-sans overflow-x-hidden selection:bg-red-900 selection:text-white min-h-screen flex flex-col">
  <!-- NAVBAR_PLACEHOLDER -->
  
  <main class="flex-1 w-full pt-16">
    <!-- Premium Search Header -->
    <section class="relative w-full overflow-hidden bg-[#0a0505] pt-20 pb-12 lg:pt-24 lg:pb-16 border-b border-red-900/20">
      <!-- Atmospheric Background Elements -->
      <div class="absolute inset-0 z-0 opacity-40 pointer-events-none">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[80%] h-full bg-red-900/10 blur-[100px] rounded-full"></div>
      </div>
      
      <div class="container mx-auto px-4 md:px-6 relative z-10 max-w-5xl text-center">
        <h1 class="text-3xl md:text-5xl font-black text-white mb-8 tracking-tight">
          البحث في <span class="text-red-600">NIGHTMAReS</span>
        </h1>
        
        <!-- Search Bar -->
        <form id="search-page-form" class="w-full mx-auto relative z-20">
          <div class="search-input-wrapper relative flex items-center bg-[#110808] border border-red-900/40 rounded-2xl overflow-hidden transition-all duration-300">
            <div class="pl-2 pr-6 py-4 md:py-5 text-gray-400">
              <i class="fa-solid fa-magnifying-glass text-xl md:text-2xl text-red-700"></i>
            </div>
            <input type="search" id="search-page-input" placeholder="ابحث عن قصة، خبر، أو فيديو مرعب..." class="flex-1 bg-transparent border-none text-white text-lg md:text-xl placeholder-gray-600 focus:outline-none focus:ring-0 py-4 md:py-5 px-2 font-medium w-full">
            <button type="submit" aria-label="إرسال البحث" class="mx-3 px-6 md:px-8 py-3 bg-red-800 hover:bg-red-700 text-white font-bold rounded-xl transition-all shadow-[0_4px_14px_rgba(220,38,38,0.25)] hover:shadow-[0_6px_20px_rgba(220,38,38,0.4)] hidden md:block">
              بحث
            </button>
          </div>
          
          <button type="submit" class="w-full mt-4 py-4 bg-red-800 text-white font-bold rounded-xl md:hidden flex items-center justify-center gap-2">
            <i class="fa-solid fa-magnifying-glass"></i> بحث
          </button>
          
          <!-- Filters Section -->
          <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Type Filter -->
            <div class="relative">
              <select id="filter-type" class="w-full appearance-none px-4 py-3 bg-[#110808]/80 border border-gray-800 rounded-xl text-gray-300 focus:outline-none focus:border-red-600 focus:bg-[#110808] transition-all font-semibold cursor-pointer text-sm">
                <option value="">أي نوع محتوى</option>
                <option value="story">قصص فقط</option>
                <option value="news">أخبار فقط</option>
                <option value="video">فيديوهات فقط</option>
              </select>
              <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-gray-500">
                <i class="fa-solid fa-chevron-down text-xs"></i>
              </div>
            </div>
            
            <!-- Category Filter -->
            <div class="relative">
              <select id="filter-category" class="w-full appearance-none px-4 py-3 bg-[#110808]/80 border border-gray-800 rounded-xl text-gray-300 focus:outline-none focus:border-red-600 focus:bg-[#110808] transition-all font-semibold cursor-pointer text-sm">
                <option value="">جميع التصنيفات</option>
                <option value="horror">رعب (Horror)</option>
                <option value="mystery">غموض (Mystery)</option>
                <option value="true_crime">جرائم حقيقية (True Crime)</option>
                <option value="paranormal">ما وراء الطبيعة (Paranormal)</option>
                <option value="legends">أساطير (Legends)</option>
                <option value="movies">أفلام (Movies)</option>
                <option value="games">ألعاب (Games)</option>
              </select>
              <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-gray-500">
                <i class="fa-solid fa-chevron-down text-xs"></i>
              </div>
            </div>
            
            <!-- Tag Filter -->
            <div class="relative">
              <input type="text" id="filter-tag" placeholder="كلمة دلالية (Tag)..." class="w-full px-4 py-3 bg-[#110808]/80 border border-gray-800 rounded-xl text-gray-300 focus:outline-none focus:border-red-600 focus:bg-[#110808] transition-all font-semibold text-sm placeholder-gray-600">
              <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-gray-500">
                <i class="fa-solid fa-hashtag text-xs"></i>
              </div>
            </div>
          </div>
        </form>
      </div>
    </section>

    <!-- Main Content Area -->
    <div class="container mx-auto px-4 md:px-8 lg:px-12 py-12 max-w-7xl">
      <!-- Firestore Limitation Notice -->
      <div class="flex justify-center mb-10">
        <div class="inline-flex items-center gap-2 px-4 py-2 bg-gray-900/50 border border-gray-800 rounded-full text-xs text-gray-500 font-medium">
          <i class="fa-solid fa-circle-info text-gray-600"></i>
          يتم البحث نصياً ضمن أحدث المنشورات المطابقة للفلاتر لتوفير نتائج دقيقة وسريعة.
        </div>
      </div>
      
      <!-- Initial / Stats State -->
      <div id="search-stats" class="text-center py-12 text-gray-400 font-bold text-lg hidden">
        <!-- Text injected by JS -->
      </div>

      <!-- Loading State -->
      <div id="loading" class="flex flex-col items-center justify-center py-20 hidden">
        <div class="relative w-16 h-16 mb-6">
          <div class="absolute inset-0 rounded-full border-4 border-red-900/30"></div>
          <div class="absolute inset-0 rounded-full border-4 border-red-600 border-t-transparent animate-spin"></div>
        </div>
        <p class="text-gray-400 font-bold tracking-wider animate-pulse">نبحث في الأعماق...</p>
      </div>
      
      <!-- Empty State -->
      <div id="empty-state" class="hidden text-center py-24 bg-[#0a0505] rounded-2xl border border-gray-900/50">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gray-900/50 text-gray-600 mb-6 border border-gray-800">
          <i class="fa-solid fa-search-minus text-3xl"></i>
        </div>
        <h3 class="text-white font-bold text-2xl mb-3">لم يتم العثور على أي نتائج</h3>
        <p class="text-gray-500 text-base max-w-md mx-auto">
          جرب استخدام كلمات بحث مختلفة أو تأكد من إملاء الكلمات بشكل صحيح، أو قم بتقليل الفلاتر للحصول على نتائج أوسع.
        </p>
      </div>

      <!-- Results Grid -->
      <div id="results-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden">
        <!-- Results will be injected here -->
      </div>
      
      <!-- Load More Button -->
      <div id="load-more-container" class="mt-16 text-center hidden">
        <button id="load-more-btn" class="group relative px-8 py-3 bg-[#0a0505] border border-red-900/40 text-gray-300 hover:text-white rounded-full transition-all duration-300 font-bold overflow-hidden shadow-[0_0_15px_rgba(0,0,0,0.5)] hover:border-red-600">
          <span class="relative z-10 flex items-center gap-2">
            البحث في الدفعة الأقدم <i class="fa-solid fa-clock-rotate-left text-sm group-hover:-rotate-90 transition-transform duration-500"></i>
          </span>
          <div class="absolute inset-0 bg-red-900/20 -translate-x-[150%] group-hover:translate-x-0 transition-transform duration-500 ease-in-out skew-x-12"></div>
        </button>
      </div>
    </div>
  </main>

  <!-- FOOTER_PLACEHOLDER -->
  
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script type="module" src="/js/search.js"></script>
</body>
</html>
