<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البحث في الكوابيس - Nightmares</title>
  <meta name="description" content="ابحث عن قصص الرعب، ألعاب، أو الأخبار المرعبة.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/5.5.2/css/ionicons.min.css">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    body {
      background: linear-gradient(180deg, #320101, #000000);
      background-attachment: fixed;
      font-family: 'Cairo', sans-serif;
      color: white;
    }
    .highlight-match {
      background-color: rgba(220, 38, 38, 0.4);
      color: white;
      font-weight: bold;
      padding: 0 2px;
      border-radius: 2px;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- NAVBAR_PLACEHOLDER -->

  <div class="wrapper flex-1">
    <div class="container mx-auto px-4 pt-32 pb-12 max-w-7xl">
      <h1 class="text-4xl font-bold text-center mb-8 text-red-600 drop-shadow-md">البحث المتقدم</h1>
      
      <div class="bg-black/40 border border-red-900/30 rounded-2xl p-6 mb-10 shadow-lg backdrop-blur-sm max-w-4xl mx-auto">
        <form id="search-page-form" class="space-y-4">
          <div class="relative">
            <input type="search" id="search-page-input" placeholder="ابحث عن كلمات في العناوين أو المحتوى..." class="w-full px-6 py-4 rounded-full bg-[#1b0d0d] border border-red-900/50 text-white focus:outline-none focus:border-red-500 text-lg shadow-inner">
            <button type="submit" class="absolute left-2 top-1/2 -translate-y-1/2 bg-red-800 text-white rounded-full p-3 hover:bg-red-700 transition">
              <ion-icon name="search-outline" class="text-xl"></ion-icon>
            </button>
          </div>
          
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
            <div>
              <label class="block text-sm font-semibold text-gray-400 mb-1">النوع</label>
              <select id="filter-type" class="w-full px-4 py-2 bg-[#1b0d0d] border border-red-900/50 rounded-lg text-white focus:outline-none focus:border-red-500">
                <option value="">الكل</option>
                <option value="story">قصص</option>
                <option value="news">أخبار</option>
                <option value="video">فيديوهات</option>
              </select>
            </div>
            
            <div>
              <label class="block text-sm font-semibold text-gray-400 mb-1">التصنيف</label>
              <select id="filter-category" class="w-full px-4 py-2 bg-[#1b0d0d] border border-red-900/50 rounded-lg text-white focus:outline-none focus:border-red-500">
                <option value="">الكل</option>
                <option value="horror">رعب (Horror)</option>
                <option value="mystery">غموض (Mystery)</option>
                <option value="true_crime">جرائم حقيقية (True Crime)</option>
                <option value="paranormal">ما وراء الطبيعة (Paranormal)</option>
                <option value="legends">أساطير (Legends)</option>
                <option value="movies">أفلام (Movies)</option>
                <option value="games">ألعاب (Games)</option>
              </select>
            </div>
            
            <div>
              <label class="block text-sm font-semibold text-gray-400 mb-1">كلمة دلالية (Tag)</label>
              <input type="text" id="filter-tag" placeholder="مثال: ghost" class="w-full px-4 py-2 bg-[#1b0d0d] border border-red-900/50 rounded-lg text-white focus:outline-none focus:border-red-500">
            </div>
          </div>
        </form>
      </div>

      <!-- Firestore Limitation Notice -->
      <div class="max-w-4xl mx-auto mb-6 text-center">
        <p class="text-xs text-gray-500 bg-red-900/10 border border-red-900/20 py-2 px-4 rounded inline-block">
          <i class="fas fa-info-circle mr-1"></i> يتم البحث نصياً ضمن أحدث المنشورات المطابقة للفلاتر (نطاق البحث: أحدث 50 منشور لكل دفعة).
        </p>
      </div>

      <div id="loading" class="flex flex-col items-center justify-center py-12 hidden">
        <div class="w-10 h-10 border-4 border-red-900 border-t-red-500 rounded-full animate-spin mb-4"></div>
        <p class="text-gray-400 font-semibold">جاري البحث في الأعماق...</p>
      </div>

      <div id="search-stats" class="text-gray-300 mb-6 font-semibold hidden text-center text-lg"></div>

      <div id="empty-state" class="hidden text-center py-16 bg-black/30 rounded-2xl border border-gray-800 max-w-4xl mx-auto">
        <p class="text-gray-400 text-xl font-semibold mb-2">لم يتم العثور على أي نتائج مطابقة.</p>
        <p class="text-gray-500 text-sm mb-6">جرب استخدام كلمات مختلفة أو تخفيف الفلاتر.</p>
      </div>

      <!-- Results Grid -->
      <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
        <!-- Results will be injected here -->
      </div>
      
      <!-- Load More Button -->
      <div id="load-more-container" class="mt-12 text-center hidden">
        <button id="load-more-btn" class="px-8 py-3 bg-transparent border border-red-900 text-red-500 hover:bg-red-900/20 hover:text-white rounded-full transition-colors font-bold shadow-[0_0_10px_rgba(220,38,38,0.1)]">مسح الدفعة الأقدم</button>
      </div>

    </div>
  </div>

  <script type="module" src="/js/search.js"></script>
<!-- FOOTER_PLACEHOLDER -->
</body>
</html>
