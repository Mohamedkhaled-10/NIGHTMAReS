<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightmares</title>
  <link rel="stylesheet" href="/styles/article.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/5.5.2/css/ionicons.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .loading-spinner { display: flex; justify-content: center; align-items: center; height: 50vh; font-size: 2em; color: red; }
    .hidden { display: none !important; }
  </style>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
</head>
<body class="min-h-screen flex flex-col bg-[#050202] text-white overflow-x-hidden">
  <div id="progress-bar" style="position: fixed; top: 0; left: 0; height: 5px; background-color: #ff0000; width: 0%; z-index: 1001; transition: width 0.1s;"></div>
  
  <div class="wrapper">
    <!-- NAVBAR_PLACEHOLDER -->

    
    <div id="loading" class="col-span-full"></div>

    <main id="content-area" class="grow hidden w-full flex-col items-center pt-20 md:pt-24 pb-12 md:pb-16">
      <!-- Article Cover Image -->
      <div id="cover-image-container" class="hidden w-[90%] md:w-[80%] max-w-[900px] mx-auto mb-6 rounded-xl overflow-hidden shadow-[0_5px_15px_rgba(0,0,0,0.5)]">
        <img id="article-cover-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Cover Image" class="w-full h-auto max-h-[500px] object-cover block">
      </div>

      <h1 class="story-title" id="article-title"></h1>
      
      <!-- Author Info (Injected dynamically if available) -->
      <div id="article-author" class="hidden flex justify-center items-center gap-3 mt-4 mb-2">
        <a id="article-author-link" href="#" class="flex items-center gap-2 text-gray-300 hover:text-red-400 transition">
          <img id="article-author-avatar" src="/assets/images/logo1.png" class="w-8 h-8 rounded-full border border-red-900/30 object-cover" alt="Author">
          <span id="article-author-name" class="font-bold"></span>
        </a>
      </div>
      
      <!-- Category and Tags -->
      <div id="article-taxonomy" class="hidden w-[80%] max-w-[900px] mx-auto text-center my-2">
        <span id="article-category" class="inline-block bg-red-900/40 text-red-300 px-3 py-1 rounded-full text-sm font-semibold border border-red-900/30 mb-2"></span>
        <div id="article-tags" class="flex flex-wrap justify-center gap-2 mt-2"></div>
      </div>

      <div class="story-separator"></div>
      
      <section class="article-container">
        <div class="article-box" id="article-body">
          <!-- Content goes here -->
        </div>
      </section>

      <div class="share-buttons">
        <a id="share-whatsapp" href="#" target="_blank" class="share-btn whatsapp" title="شارك على واتساب">
          <img src="/assets/images/whatsapp-512.png" alt="WhatsApp" />
        </a>
        <a id="share-facebook" href="#" target="_blank" class="share-btn facebook" title="شارك على فيسبوك">
          <img src="/assets/images/facebook-512.png" alt="Facebook" />
        </a>
      </div>

      <!-- Related Content Section -->
      <section id="related-content-section" class="article-container hidden" style="margin-top: 40px; margin-bottom: 20px;">
        <h3 class="text-2xl font-bold text-red-600 mb-6 drop-shadow-md border-b border-red-900/30 pb-2">قد يعجبك أيضًا</h3>
        <div id="related-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Related cards will be injected here -->
        </div>
      </section>

      <!-- Interactions Section (Likes & Comments) -->
      <section id="interactions-section" class="article-container mt-8 font-cairo">
        <div class="flex items-center justify-between border-b border-gray-600 pb-3 mb-5">
          <h3 class="text-2xl font-bold">التفاعلات والتعليقات</h3>
          <div class="flex gap-5 items-center text-gray-400 text-lg">
            <span class="flex items-center gap-2" title="المشاهدات">
              <i class="fas fa-eye"></i> <span id="views-count">0</span>
            </span>
            <span class="flex items-center gap-2" title="التعليقات">
              <i class="fas fa-comment"></i> <span id="comments-count">0</span>
            </span>
            <button id="btn-save-post" aria-label="حفظ المقال" class="bg-transparent border-none text-gray-400 cursor-pointer text-xl flex items-center gap-2 hover:text-white transition-colors" title="حفظ المقال">
              <i class="far fa-bookmark" id="save-icon"></i>
            </button>
            <button id="btn-report-post" aria-label="إبلاغ" class="bg-transparent border-none text-gray-400 cursor-pointer text-xl flex items-center gap-2 hover:text-white transition-colors" title="الإبلاغ عن محتوى">
              <i class="fas fa-flag"></i>
            </button>
            <button id="btn-like" aria-label="إعجاب" class="bg-transparent border-none text-gray-400 cursor-pointer text-xl flex items-center gap-2 hover:text-red-500 transition-colors">
              <i class="fas fa-heart" id="like-icon"></i>
              <span id="likes-count">0</span>
            </button>
          </div>
        </div>
        
        <!-- Add Comment Form -->
        <div id="comment-form-container" class="hidden" style="margin-bottom: 30px;">
          <form id="comment-form" style="display: flex; flex-direction: column; gap: 10px;">
            <textarea id="comment-text" rows="3" placeholder="أضف تعليقاً..." style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid #555; font-family: 'Tajawal', sans-serif; resize: vertical;" required></textarea>
            <button type="submit" style="align-self: flex-end; background: #e50914; color: #fff; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">تعليق</button>
          </form>
        </div>
        <div id="login-prompt" style="text-align: center; margin-bottom: 30px; color: #aaa;">
          يجب <a href="/login" style="color: #e50914; text-decoration: underline;">تسجيل الدخول</a> لإضافة إعجاب أو تعليق.
        </div>

        <!-- Comments List -->
        <div id="comments-list" style="display: flex; flex-direction: column; gap: 20px;">
          <div style="text-align: center; color: #888;">جاري تحميل التعليقات...</div>
        </div>
      </section>

      <!-- Report Modal -->
      <div id="report-modal" class="hidden fixed inset-0 bg-black/80 z-[9999] flex justify-center items-center backdrop-blur-sm">
        <div class="bg-[#111] border border-red-900/30 rounded-xl p-6 max-w-md w-full mx-4 shadow-2xl">
          <h3 class="text-xl font-bold text-white mb-4 border-b border-red-900/30 pb-2">تقديم إبلاغ</h3>
          <p class="text-gray-400 text-sm mb-4">يرجى تحديد سبب الإبلاغ. نحن نأخذ جميع الإبلاغات على محمل الجد.</p>
          <select id="report-reason" class="w-full bg-[#222] border border-red-900/30 rounded p-2 text-white mb-4 outline-none focus:border-red-600">
            <option value="spam">محتوى مزعج (Spam)</option>
            <option value="harassment">مضايقة أو تنمر</option>
            <option value="inappropriate">محتوى غير لائق</option>
            <option value="hate_speech">خطاب كراهية</option>
            <option value="other">أخرى</option>
          </select>
          <textarea id="report-details" rows="3" class="w-full bg-[#222] border border-red-900/30 rounded p-2 text-white mb-4 outline-none focus:border-red-600" placeholder="تفاصيل إضافية (اختياري)..."></textarea>
          <div id="report-msg" class="hidden text-sm mb-4 font-bold text-center"></div>
          <div class="flex gap-3 justify-end mt-2">
            <button id="btn-cancel-report" class="px-4 py-2.5 bg-gray-700 hover:bg-gray-600 text-white rounded transition">إلغاء</button>
            <button id="btn-submit-report" class="px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded transition">إرسال الإبلاغ</button>
          </div>
        </div>
      </div>
      
    </div>
    
    <button id="scrollToTop" style="display: none;">عودة للأعلى</button>

    <!-- FOOTER_PLACEHOLDER -->

  </div>

  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  
  
  
  
  
  <script type="module" src="/js/article.js"></script>
  <script type="module" src="/js/interactions.js"></script>

</body>
</html>
