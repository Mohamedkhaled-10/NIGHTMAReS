<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightmares</title>
  <link rel="stylesheet" href="/styles/article.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/5.5.2/css/ionicons.min.css">
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .loading-spinner { display: flex; justify-content: center; align-items: center; height: 50vh; font-size: 2em; color: red; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="progress-bar" style="position: fixed; top: 0; left: 0; height: 5px; background-color: #ff0000; width: 0%; z-index: 1001; transition: width 0.1s;"></div>
  
  <div class="wrapper">
    <!-- NAVBAR_PLACEHOLDER -->

    
    <div id="loading" class="loading-spinner">جارِ التحميل...</div>

    <div id="content-area" class="hidden">
      <!-- Article Cover Image -->
      <div id="cover-image-container" style="display: none; max-width: 900px; width: 80%; margin: 100px auto 10px; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
        <img id="article-cover-image" src="" alt="Cover Image" style="width: 100%; height: auto; max-height: 500px; object-fit: cover; display: block;">
      </div>

      <h1 class="story-title" id="article-title" style="margin-top: 20px;"></h1>
      <div class="story-separator"></div>
      
      <section class="article-container">
        <div class="article-box" id="article-body">
          <!-- Content goes here -->
        </div>
      </section>

      <div class="share-buttons">
        <a id="share-whatsapp" href="#" target="_blank" class="share-btn whatsapp" title="شارك على واتساب">
          <img src="/assets/images/whatsapp-512.png" alt="WhatsApp" />
        </a>
        <a id="share-facebook" href="#" target="_blank" class="share-btn facebook" title="شارك على فيسبوك">
          <img src="/assets/images/facebook-512.png" alt="Facebook" />
        </a>
      </div>
      
      <!-- Interactions Section (Likes & Comments) -->
      <section id="interactions-section" class="article-container" style="margin-top: 30px; font-family: 'Cairo', sans-serif;">
        <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px;">
          <h3 style="font-size: 1.5em;">التعليقات</h3>
          <button id="btn-like" style="background: none; border: none; color: #aaa; cursor: pointer; font-size: 1.2em; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-heart" id="like-icon"></i>
            <span id="likes-count">0</span> إعجاب
          </button>
        </div>
        
        <!-- Add Comment Form -->
        <div id="comment-form-container" style="display: none; margin-bottom: 30px;">
          <form id="comment-form" style="display: flex; flex-direction: column; gap: 10px;">
            <textarea id="comment-text" rows="3" placeholder="أضف تعليقاً..." style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid #555; font-family: inherit; resize: vertical;" required></textarea>
            <button type="submit" style="align-self: flex-end; background: #e50914; color: #fff; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">تعليق</button>
          </form>
        </div>
        <div id="login-prompt" style="text-align: center; margin-bottom: 30px; color: #aaa;">
          يجب <a href="/login" style="color: #e50914; text-decoration: underline;">تسجيل الدخول</a> لإضافة إعجاب أو تعليق.
        </div>

        <!-- Comments List -->
        <div id="comments-list" style="display: flex; flex-direction: column; gap: 20px;">
          <div style="text-align: center; color: #888;">جاري تحميل التعليقات...</div>
        </div>
      </section>
      
    </div>
    
    <button id="scrollToTop" style="display: none;">عودة للأعلى</button>

    <!-- FOOTER_PLACEHOLDER -->

  </div>

  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  
  
  
  
  
  <script type="module" src="/js/article.js"></script>
  <script type="module" src="/js/interactions.js"></script>
</body>
</html>
