<!DOCTYPE html>
<html lang="ar">
<head>
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('nightmares-theme');
        var theme = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightmares</title>
  <link rel="stylesheet" href="/styles/article.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/5.5.2/css/ionicons.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .loading-spinner { display: flex; justify-content: center; align-items: center; height: 50vh; font-size: 2em; color: red; }
    .hidden { display: none !important; }
  </style>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
</head>
<body class="min-h-screen flex flex-col bg-[#050202] text-white overflow-x-hidden">
  <div id="progress-bar" style="position: fixed; top: 0; left: 0; height: 5px; background-color: #ff0000; width: 0%; z-index: 1001; transition: width 0.1s;"></div>
  
  <div class="wrapper">
    <!-- NAVBAR_PLACEHOLDER -->

    
    <div id="loading" class="col-span-full"></div>

    
    <main id="content-area" class="grow hidden w-full flex-col items-center pt-20 md:pt-28 pb-12 md:pb-16 article-page-container">
      
      <!-- 1. HEADER SECTION -->
      <header class="article-header w-[90%] md:w-[80%] max-w-[900px] mx-auto text-center mb-10">
        <div id="article-taxonomy" class="hidden mb-6">
           <span id="article-category" class="category-badge uppercase tracking-wider text-sm font-bold bg-red-900/40 text-red-400 px-4 py-1.5 rounded-full border border-red-900/50"></span>
        </div>
        
        <h1 id="article-title" class="article-main-title text-3xl md:text-5xl font-black text-white leading-tight mb-8 drop-shadow-lg"></h1>
        
        <div id="article-author" class="hidden author-meta-bar flex flex-wrap justify-center items-center gap-4 text-gray-400 text-sm md:text-base">
          <a id="article-author-link" href="#" class="flex items-center gap-3 hover:text-red-400 transition-colors">
            <img id="article-author-avatar" src="/assets/images/logo1.png" class="w-10 h-10 rounded-full border-2 border-red-900/50 object-cover shadow-md" alt="Author">
            <span id="article-author-name" class="font-bold text-gray-200"></span>
          </a>
          <span class="text-gray-600 hidden md:inline">•</span>
          <span id="article-date-meta" class="meta-date"></span>
          <span id="article-read-time" class="hidden"><span class="text-gray-600 mx-2">•</span> <i class="far fa-clock mr-1"></i> <span id="read-time-val"></span></span>
        </div>
      </header>

      <!-- 2. COVER MEDIA -->
      <div id="cover-image-container" class="hidden w-[95%] md:w-[85%] max-w-[1000px] mx-auto mb-12 rounded-2xl overflow-hidden shadow-soft relative">
        <img id="article-cover-image" src="" alt="Cover Image" class="w-full h-auto max-h-[600px] object-cover block">
      </div>

      <!-- 3. MAIN CONTENT -->
      <section class="article-body-wrapper w-[90%] md:w-[75%] max-w-[850px] mx-auto text-gray-300 text-lg md:text-xl leading-relaxed font-cairo">
        <div class="article-box" id="article-body">
          <!-- Content goes here -->
        </div>
      </section>

      <!-- 4. CONTENT ACTIONS -->
      <section class="article-actions-bar w-[90%] md:w-[75%] max-w-[850px] mx-auto mt-16 mb-12 py-6 border-y border-red-900/20 flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="action-buttons-group flex gap-4">
          <button id="btn-like" aria-label="إعجاب" class="flex items-center gap-2 px-6 py-3 bg-[#110808] hover:bg-[#1a0c0c] border border-red-900/30 hover:border-red-500 rounded-xl transition-all group" title="إعجاب">
            <i class="fas fa-heart text-gray-500 group-hover:text-red-500 text-xl transition-colors" id="like-icon"></i>
            <span id="likes-count" class="font-bold">0</span>
          </button>
          <button id="btn-save-post" aria-label="حفظ المقال" class="flex items-center justify-center w-12 h-12 bg-[#110808] hover:bg-[#1a0c0c] border border-red-900/30 hover:border-red-500 rounded-xl transition-all group" title="حفظ المقال">
            <i class="far fa-bookmark text-gray-500 group-hover:text-white text-xl transition-colors" id="save-icon"></i>
          </button>
          <button id="btn-report-post" aria-label="إبلاغ" class="flex items-center justify-center w-12 h-12 bg-[#110808] hover:bg-[#1a0c0c] border border-red-900/30 hover:border-red-500 rounded-xl transition-all group" title="الإبلاغ عن محتوى">
            <i class="fas fa-flag text-gray-500 group-hover:text-gray-300 text-xl transition-colors"></i>
          </button>
        </div>
        <div class="share-buttons-group flex gap-3">
          <span class="text-sm text-gray-500 mr-2 self-center font-bold">شارك:</span>
          <a id="share-whatsapp" href="#" target="_blank" class="flex items-center justify-center w-10 h-10 bg-[#0d140e] hover:bg-[#121c14] border border-green-900/30 hover:border-green-500 rounded-full transition-all group" title="شارك على واتساب">
            <i class="fab fa-whatsapp text-green-600 group-hover:text-green-400 text-lg"></i>
          </a>
          <a id="share-facebook" href="#" target="_blank" class="flex items-center justify-center w-10 h-10 bg-[#080d14] hover:bg-[#0c131c] border border-blue-900/30 hover:border-blue-500 rounded-full transition-all group" title="شارك على فيسبوك">
            <i class="fab fa-facebook-f text-blue-600 group-hover:text-blue-400 text-lg"></i>
          </a>
        </div>
      </section>

      <!-- 5. TAGS -->
      <section id="tags-section" class="hidden w-[90%] md:w-[75%] max-w-[850px] mx-auto mb-16">
        <div id="article-tags" class="flex flex-wrap justify-center md:justify-start gap-3"></div>
      </section>

      <!-- 7. RELATED CONTENT -->
      <section id="related-content-section" class="hidden w-[90%] md:w-[85%] max-w-[1100px] mx-auto mb-20">
        <h3 class="text-2xl font-black text-white mb-8 border-r-4 border-red-600 pr-4 drop-shadow-md">قد يعجبك أيضًا</h3>
        <div id="related-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
          <!-- Related cards will be injected here -->
        </div>
      </section>

      <!-- 8. INTERACTIONS & COMMENTS -->
      <section id="interactions-section" class="w-[90%] md:w-[75%] max-w-[850px] mx-auto font-cairo bg-[#0a0505] p-6 md:p-10 rounded-2xl border border-red-900/20 shadow-soft mb-12">
        <div class="flex items-center justify-between border-b border-red-900/20 pb-6 mb-8">
          <h3 class="text-2xl font-black text-white">التعليقات</h3>
          <div class="flex gap-6 items-center text-gray-400 text-lg font-bold">
            <span class="flex items-center gap-2" title="المشاهدات">
              <i class="fas fa-eye text-red-900"></i> <span id="views-count">0</span>
            </span>
            <span class="flex items-center gap-2" title="التعليقات">
              <i class="fas fa-comment text-red-900"></i> <span id="comments-count">0</span>
            </span>
          </div>
        </div>
        
        <!-- Add Comment Form -->
        <div id="comment-form-container" class="hidden mb-12">
          <form id="comment-form" class="flex flex-col gap-4">
            <textarea id="comment-text" rows="4" placeholder="أضف تعليقاً يثري النقاش..." class="w-full p-4 rounded-xl bg-[#110808] text-white border border-red-900/30 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none font-cairo transition-all resize-y" required></textarea>
            <button type="submit" class="self-end bg-red-700 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-xl transition-all glow-subtle hover:glow-accent">إضافة التعليق</button>
          </form>
        </div>
        <div id="login-prompt" class="text-center mb-12 py-8 bg-[#110808] rounded-xl border border-red-900/20">
          <p class="text-gray-400 text-lg">يجب <a href="/login" class="text-red-500 hover:text-red-400 font-bold underline underline-offset-4 decoration-red-900">تسجيل الدخول</a> للمشاركة في النقاش.</p>
        </div>

        <!-- Comments List -->
        <div id="comments-list" class="flex flex-col gap-6">
          <div class="text-center text-gray-500 py-8">جاري تحميل التعليقات...</div>
        </div>
      </section>

      <!-- Report Modal -->
      <div id="report-modal" class="hidden fixed inset-0 bg-black/80 z-[9999] flex justify-center items-center backdrop-blur-sm">
        <div class="bg-[#110808] border border-red-900/30 rounded-2xl p-8 max-w-md w-full mx-4 shadow-soft">
          <h3 class="text-2xl font-black text-white mb-4 border-b border-red-900/20 pb-4">تقديم إبلاغ</h3>
          <p class="text-gray-400 text-sm mb-6">يرجى تحديد سبب الإبلاغ. نحن نأخذ جميع الإبلاغات على محمل الجد.</p>
          <select id="report-reason" class="w-full bg-[#1a0c0c] border border-red-900/30 rounded-xl p-3 text-white mb-4 outline-none focus:border-red-500 font-cairo">
            <option value="spam">محتوى مزعج (Spam)</option>
            <option value="harassment">مضايقة أو تنمر</option>
            <option value="inappropriate">محتوى غير لائق</option>
            <option value="hate_speech">خطاب كراهية</option>
            <option value="other">أخرى</option>          
          </select>
          <textarea id="report-details" rows="4" class="w-full bg-[#1a0c0c] border border-red-900/30 rounded-xl p-3 text-white mb-6 outline-none focus:border-red-500 font-cairo resize-none" placeholder="تفاصيل إضافية (اختياري)..."></textarea>
          <div id="report-msg" class="hidden text-sm mb-4 font-bold text-center"></div>
          <div class="flex gap-4 justify-end mt-2">
            <button id="btn-cancel-report" class="px-6 py-2.5 bg-transparent hover:bg-gray-800 text-gray-300 font-bold rounded-xl transition-colors">إلغاء</button>
            <button id="btn-submit-report" class="px-6 py-2.5 bg-red-700 hover:bg-red-600 text-white font-bold rounded-xl transition-colors">إرسال الإبلاغ</button>
          </div>
        </div>
      </div>    
    </main>
    <button id="scrollToTop" class="hidden opacity-0 pointer-events-none transition-all duration-300 fixed bottom-6 left-6 z-50 bg-red-700 text-white w-12 h-12 rounded-full flex items-center justify-center glow-subtle hover:glow-accent hover:bg-red-600 hover:scale-110"><i class="fas fa-arrow-up"></i></button>
    <!-- FOOTER_PLACEHOLDER -->


  </div>

  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  
  
  
  
  
  <script type="module" src="/js/article.js"></script>
  <script type="module" src="/js/interactions.js"></script>

</body>
</html>
