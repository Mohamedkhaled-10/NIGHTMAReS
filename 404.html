<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('nightmares-theme');
        var theme = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - الصفحة غير موجودة | Nightmares</title>
  <meta name="robots" content="noindex, follow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-[#050202] text-gray-200 min-h-screen flex flex-col items-center justify-center relative overflow-hidden overflow-x-hidden">
  
  <div class="absolute inset-0 z-0 opacity-10" ></div>
  <div class="absolute inset-0 z-0 bg-gradient-to-b from-transparent to-red-900/20"></div>

  <div class="relative z-10 text-center px-4">
    <div class="text-[150px] md:text-[200px] font-black leading-none text-red-900/50 mb-4 select-none animate-pulse">404</div>
    <h1 class="text-3xl md:text-5xl font-bold text-white mb-6">لقد ضللت الطريق في الظلام...</h1>
    <p class="text-gray-400 text-lg md:text-xl mb-10 max-w-xl mx-auto leading-relaxed">
      الصفحة التي تبحث عنها غير موجودة أو تم ابتلاعها في الهاوية. احترس من بقائك هنا طويلاً.
    </p>
    <a href="/" class="inline-flex items-center gap-3 bg-red-700 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-lg transition transform hover:-translate-y-1 shadow-lg hover:shadow-red-900/50">
      <i class="fas fa-home"></i> العودة إلى الأمان (الرئيسية)
    </a>
  </div>

</body>
</html>
